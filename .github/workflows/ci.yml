name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run zero-dependency tests
        run: python -m unittest discover -s tests -v
      - name: Verify wheel contents and console metadata
        run: |
          python -m pip install --no-deps .
          ladder --version
          ladder demo --dir "$RUNNER_TEMP/demo"
          ladder validate --dir "$RUNNER_TEMP/demo"
