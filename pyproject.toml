[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ladder-climb"
version = "0.2.1"
description = "Agent-first live ladder-climb leaderboard and atomic multi-agent benchmark harness"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ladder Climb contributors"}]
keywords = ["benchmarking", "agents", "optimization", "dashboard", "ladder-climbing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = []

[project.scripts]
ladder = "ladder_climb.cli:main"
ladder-climb = "ladder_climb.cli:main"

[project.urls]
Repository = "https://github.com/vcruz305/ladder-climb"
Issues = "https://github.com/vcruz305/ladder-climb/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ladder_climb = ["assets/*.html", "assets/*.css", "assets/*.js"]
